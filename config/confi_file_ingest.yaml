version_config_file: "v1.0"

# ========================
# Configuração de Fonte
# ========================
source:
  path_blob: "abfss://<container>@<storage_account>.dfs.core.windows.net/"
  directory: "raw_compass/d_ingest_apple_store"
  format: "csv"                               # Formato do arquivo: csv, parquet, json
  delimiter: ","                              # Separador CSV
  header: true                                # CSV com cabeçalho
  encoding: "utf-8"                           # Encoding do arquivo
  recursive: true                             # Lê subdiretórios automaticamente
  date_partition_column: "load_date"          # Coluna de partição por data

# ========================
# Configuração do Alvo
# ========================
target:
  path_blob: "abfss://<container>@<storage_account>.dfs.core.windows.net/"
  directory: "b_compass/"
  format: "delta"                              # Delta Lake para bronze
  mode: "overwrite"                            # Overwrite, append, merge
  partitionBy: ["load_date"]                   # Colunas de partição

# ========================
# Governança / Catalogo
# ========================
governance:
  database: "bronze"
  table: "apple_store"
  version: "${version_config_file}"
  description: "Bronze layer Apple Store reviews"
  retention_days: 90                           # Política de retenção

# ========================
# Telemetria / Observabilidade
# ========================
telemetry:
  active: true

# ========================
# Extra / fallback
# ========================
fallback:
  create_empty_if_missing: true  # Cria DF vazio se não encontrar dados

default_schema: |
  {
    "author_name": "string",
    "author_uri": "string",
    "content": "string",
    "content_attributes_label": "string",
    "content_attributes_term": "string",
    "id": "string",
    "im_rating": "double",
    "im_version": "string",
    "im_votecount": "integer",
    "im_votesum": "integer",
    "link_attributes_href": "string",
    "link_attributes_related": "string",
    "title": "string",
    "updated": "timestamp",
    "odate": "date",
    "ingestion_ts": "timestamp"
  }